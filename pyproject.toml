[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "newkwlab-api-bundle"
version = "0.1.0"
description = "Python SDK for the NewKwLab API Bundle gateway — one API key, one credit balance, many tools."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NewKwLab" }]
keywords = ["api", "sdk", "email-validation", "phone-validation", "credits"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

# Zero runtime dependencies: the SDK is implemented on the standard library
# (urllib) only.

[tool.setuptools.packages.find]
where = ["src"]
